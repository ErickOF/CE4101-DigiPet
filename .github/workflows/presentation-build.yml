name: Build Presentation Web Page

on:
  push:
    paths:
      - 'Presentation/DigiPet/**'
      - '.github/workflows/presentation-build.yml'
  pull_request:
    paths:
      - 'Presentation/DigiPet/**'
      - '.github/workflows/presentation-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Presentation/DigiPet

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: Presentation/DigiPet/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build presentation
        run: npm run build
